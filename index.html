<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baby Shower Andrea y Martin</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Trebuchet MS', sans-serif;
    }

    body{
      background: linear-gradient(to bottom, #fff7ef, #fdebdc);
      color:#5b4a42;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      border-radius:25px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      font-size:3rem;
      margin-bottom:15px;
      color:#9c6b5c;
    }

    .welcome{
      text-align:center;
      background:#fff5ef;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      border:2px dashed #e4b9a5;
    }

    .hero-img{
      width:100%;
      border-radius:20px;
      margin:15px 0;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    .animals{
      display:flex;
      justify-content:center;
      gap:25px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    .animal{
      width:110px;
      height:110px;
      border-radius:50%;
      background:#fff5ef;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:55px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    .question{
      background:#fff8f2;
      padding:20px;
      margin-bottom:20px;
      border-radius:18px;
      border:2px solid #f5d6c6;
    }

    label{
      display:block;
      margin:8px 0;
      cursor:pointer;
      padding:8px;
      border-radius:10px;
    }

    label:hover{
      background:#ffe8d9;
    }

    button{
      display:block;
      margin:30px auto;
      padding:15px 35px;
      border:none;
      border-radius:15px;
      background:#d8a48f;
      color:white;
      font-size:1.1rem;
      cursor:pointer;
    }

    #resultado{
      text-align:center;
      font-size:1.6rem;
      margin-top:30px;
      color:#7b4f3f;
      font-weight:bold;
      background:#fff5ef;
      padding:25px;
      border-radius:20px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- IMAGEN INICIO -->
  <img class="hero-img"
    src="https://raw.githubusercontent.com/noeliagalarzatorres-code/Baby_shower_andreymartin/main/IMG_20260508_211650.jpg">

  <h1>🍼 Baby Shower 🍼</h1>

  <div class="welcome">
    <h2>✨ Andrea y Martin ✨</h2>
    <p>👶🏼💛 Vamos a jugar para celebrar la llegada de su nuevo tesoro 💛👶🏼</p>
  </div>

  <div class="animals">
    <div class="animal">🦌</div>
    <div class="animal">🦊</div>
    <div class="animal">🐻</div>
    <div class="animal">🐰</div>
  </div>

  <form id="quizForm"></form>

  <button onclick="calcularPuntaje()">Ver Puntaje</button>

  <div id="resultado"></div>

  <!-- IMAGEN FINAL -->
  <img class="hero-img"
    src="https://raw.githubusercontent.com/noeliagalarzatorres-code/Baby_shower_andreymartin/main/IMG_20260508_211632.jpg">

</div>

<script>

const preguntas = [
{pregunta:"¿Cuántos dientes de leche tiene un bebé?",opciones:["10","20","32"],correcta:"20"},
{pregunta:"¿A qué edad suelen empezar a caminar los bebés?",opciones:["6 meses","12 meses","3 años"],correcta:"12 meses"},
{pregunta:"¿Cuál es el mejor alimento para un recién nacido?",opciones:["Leche materna","Cereales","Chocolate"],correcta:"Leche materna"},
{pregunta:"¿Cuántas horas duerme un recién nacido?",opciones:["20","16","12"],correcta:"20"},
{pregunta:"¿Qué color ven primero los bebés?",opciones:["Rojo","Azul","Negro"],correcta:"Rojo"},
{pregunta:"¿Cuál es el primer sentido que desarrolla un bebé?",opciones:["Vista","Tacto","Oído"],correcta:"Oído"},
{pregunta:"¿Qué usan los bebés para calmar encías?",opciones:["Mordillo","Leche materna","Agua fria"],correcta:"Mordillo"},
{pregunta:"¿Cuál es la temperatura normal de un bebé?",opciones:["37°C","40°C","34°C"],correcta:"37°C"},
{pregunta:"¿Cuántos huesos tiene un bebé al nacer?",opciones:["300","150","80"],correcta:"300"},
{pregunta:"¿Qué hacen los bebés al escuchar música?",opciones:["Bailan","Lloran","Duermen"],correcta:"Bailan"},
{pregunta:"¿Señal de sueño en bebés?",opciones:["Frotarse ojos","Mover las manos","Hacer pis"],correcta:"Frotarse ojos"},
{pregunta:"¿Cual es el mejor lugar dónde duermen los bebés?",opciones:["Cuna","Silla","Sofá"],correcta:"Cuna"},
{pregunta:"Animal típico baby shower?",opciones:["Zorrito","Tiburón","Tortuga"],correcta:"Zorrito"},
{pregunta:"¿Qué cambian mucho los bebés?",opciones:["Pañales","Zapatos","Calcetines"],correcta:"Pañales"},
{pregunta:"Juguete clásico bebé?",opciones:["Sonajero","Bloques","Muñeco articulado"],correcta:"Sonajero"},
{pregunta:"Cuando tienen hambre?",opciones:["Lloran","Mueven lengua","Ríen"],correcta:"Lloran"},
{pregunta:"Médico de bebés?",opciones:["Pediatra","Ginecólogo","Hematólogo"],correcta:"Pediatra"},
{pregunta:"Para tomar leche usan?",opciones:["Bibi","Vaso","Botella"],correcta:"Mamadera"},
{pregunta:"No puede faltar en el bolso del bebé nunca?",opciones:["Ibuprofeno","Pañales","Perfume"],correcta:"Bebé"},
{pregunta:"Para gatear usan ropa?",opciones:["Suave","Abrigada","Rígida"],correcta:"Suave"}
];

const form = document.getElementById("quizForm");

preguntas.forEach((q,i)=>{
let div = document.createElement("div");
div.classList.add("question");

let html = `<h3>${i+1}. ${q.pregunta}</h3>`;

q.opciones.forEach(op=>{
html += `
<label>
<input type="radio" name="p${i}" value="${op}">
${op}
</label>`;
});

div.innerHTML = html;
form.appendChild(div);
});

function calcularPuntaje(){

let puntos = 0;

preguntas.forEach((q,i)=>{
const r = document.querySelector(`input[name="p${i}"]:checked`);
if(r && r.value === q.correcta) puntos++;
});

let mensaje = "";

if(puntos <= 7){
mensaje = "😅 Sabés muy poco… Creo que no estás capacitado para cuidar al bebé, pero puedes empezar a practicar con un bebote 👶🏼😂";
}
else if(puntos <= 14){
mensaje = "😊 Sabés algo… podrías ayudar, pero con supervisión 😆";
}
else{
mensaje = "🌟 ¡SÚPER EXPERTO! Totalmente capacitado para cuidar al bebé. Apúntate para cuidar al bebé durante una salida romántica de los chicos 👶🏼💛";
}

document.getElementById("resultado").innerHTML =
`🎉 Puntaje: ${puntos}/20 🎉<br><br>${mensaje}`;
}

</script>

</body>
</html>
